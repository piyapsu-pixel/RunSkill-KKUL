const PERM=[['admin','แอดมิน'],['speaker','วิทยากร'],['both','แอดมิน + วิทยากร']];
const permName=u=>(PERM.find(x=>x[0]===permOf(u))||[0,'-'])[1];
const permToData=p=>p==='admin'?{role:'admin',isSpeaker:false}:p==='speaker'?{role:'speaker',isSpeaker:true}:{role:'admin',isSpeaker:true};
function setUsers(l){users=l;admins=l.filter(isAdm);speakers=l.filter(isSpk)}
function permCheck(id,nu){const cur=users.find(x=>x.id===id);if(!cur)return '';const after=users.map(x=>x.id===id?{...x,...nu}:x);
 if(!after.some(isAdm))return 'ต้องมีแอดมินอย่างน้อย 1 คน';
 if(me&&(me.id===id||me.username===cur.username)&&!isAdm({...cur,...nu}))return 'ไม่สามารถถอดสิทธิ์แอดมินของตัวเองได้';return ''}
function vUsers(){const opt=v=>PERM.map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('');
 return `<div class="card"><h3>ผู้ใช้งานทั้งหมด</h3><p class="mu">แอดมิน = จัดการผู้ใช้งานและแบบฟอร์มได้ · วิทยากร = จัดการอบรมได้ · แอดมิน + วิทยากร = ทั้งสองอย่าง และชื่อจะอยู่ในรายชื่อวิทยากรด้วย</p><div class="tw"><table><tr><th>ชื่อ</th><th>E-mail</th><th>Username</th><th>การจัดการ</th><th>สิทธิ์</th></tr>${users.map(u=>`<tr><td>${esc(u.firstName)} ${esc(u.lastName)}</td><td>${esc(u.email)}</td><td>${esc(u.username)}</td><td>${FB?`<button onclick="resetPw('${esc(u.email)}')">✉ รีเซ็ตรหัส</button> `:''}<button onclick="eU('${u.id}')">แก้ไข</button> <button onclick="dU('${u.id}')">ลบ</button></td><td><select onchange="chPerm('${u.id}',this)">${opt(permOf(u))}</select></td></tr>`).join('')||'<tr><td colspan="5" class="mu">ยังไม่มีผู้ใช้งาน</td></tr>'}</table></div></div>
 <div class="card"><h3 id="uh">เพิ่ม/แก้ไขผู้ใช้งาน</h3><div class="grid"><label>ชื่อจริง<input id="u1"></label><label>นามสกุล<input id="u2"></label><label>E-mail<input id="u3" oninput="autoU()"></label><label>Username<input id="u4"></label><label>Password (เว้นว่าง = Username+1234 / ตอนแก้ไขเว้นว่าง = ไม่เปลี่ยน)<input id="u5" type="text"></label><label>สิทธิ์<select id="u6">${opt('speaker')}</select></label></div><br><button class="p" onclick="saveUser()">บันทึก</button> <button onclick="render()">ล้างฟอร์ม</button></div>
 <div class="card"><h3>💾 สำรองและกู้คืนข้อมูล</h3><p class="mu">แนะนำให้สำรองอย่างน้อยปีละครั้ง และก่อนทำรายงานประจำปี เก็บไฟล์ไว้ในที่ปลอดภัย ไฟล์สำรองมีข้อมูลกิจกรรม การตั้งค่าแบบฟอร์ม รายชื่อผู้ใช้ และข้อมูลผู้รับบริการ AI Clinic (มีข้อมูลส่วนบุคคล โปรดเก็บรักษาอย่างปลอดภัย) ไม่รวมรหัสผ่านและไฟล์แนบที่อยู่ใน Google Drive</p><div class="row"><button class="p" onclick="bkJson()">⬇ สำรองข้อมูลทั้งหมด (JSON)</button><button onclick="bkXlsx()">⬇ ตารางกิจกรรมทั้งหมด (Excel)</button><label class="bkr">↥ กู้คืนจากไฟล์สำรอง<input type="file" accept=".json" onchange="bkRestore(this)" hidden></label></div></div>`}
/* ---------- Bulk edit / delete events ---------- */
let bulkSel=new Set(),bulkAi={},bulkOnly=false;
function vBulk(){const list=events.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).filter(e=>!bulkOnly||!e.aiRelated);
 const rd=(id,cur,v)=>`<label style="display:inline-flex;gap:5px;align-items:center;color:var(--tx);margin:0 10px 0 0"><input type="radio" name="ba_${id}" value="${v}" ${cur===v?'checked':''} onchange="bkAi('${id}','${v}')" style="width:auto;margin:0">${yn(v)}${v}</label>`;
 return `<div class="card"><h3>แก้ไข/ลบหลายรายการ</h3><p class="mu">ใช้ระบุค่า "เนื้อหาเกี่ยวข้องกับ AI" ให้กิจกรรมเก่าได้ทีละหลายรายการ หรือเลือกกิจกรรมเพื่อลบ (เมื่อลบกิจกรรม โฟลเดอร์ไฟล์แนบใน Google Drive จะถูกย้ายไปถังขยะด้วย) แนะนำให้สำรองข้อมูลก่อนลบ</p>
 <div class="row" style="margin-bottom:10px"><label style="display:flex;gap:6px;align-items:center;color:var(--tx);margin:0"><input type="checkbox" ${bulkOnly?'checked':''} onchange="bulkOnly=this.checked;render()" style="width:auto;margin:0">แสดงเฉพาะที่ยังไม่ระบุเนื้อหา AI</label><span class="mu">${list.length} รายการ</span></div>
 <div class="tw"><table><tr><th><input type="checkbox" onchange="bkAll(this.checked)" style="width:auto"></th><th>วันที่</th><th>หัวข้อ</th><th>วิทยากร</th><th>เนื้อหาเกี่ยวกับ AI</th></tr>
 ${list.map(e=>{const cur=bulkAi[e.id]!==undefined?bulkAi[e.id]:(e.aiRelated||'');return `<tr><td><input type="checkbox" ${bulkSel.has(e.id)?'checked':''} onchange="bkSel('${e.id}',this.checked)" style="width:auto"></td><td>${fd(e.date)}</td><td>${esc(e.topic)}</td><td>${esc(e.speaker)}</td><td style="white-space:nowrap">${rd(e.id,cur,'ใช่')}${rd(e.id,cur,'ไม่')}</td></tr>`}).join('')||'<tr><td colspan="5" class="mu">ไม่มีรายการ</td></tr>'}</table></div>
 <div class="row" style="margin-top:12px"><button class="p" onclick="bkSaveAi()">💾 บันทึกค่า AI (${Object.keys(bulkAi).length} รายการที่แก้)</button><button onclick="bkSetSel('ใช่')">ตั้งรายการที่เลือกเป็น "ใช่"</button><button onclick="bkSetSel('ไม่')">ตั้งรายการที่เลือกเป็น "ไม่"</button><button onclick="bkDel()" style="color:#dc2626">🗑 ลบรายการที่เลือก (${bulkSel.size})</button></div></div>`}
window.bkSel=(id,on)=>{on?bulkSel.add(id):bulkSel.delete(id);render()};
window.bkAll=on=>{events.filter(e=>!bulkOnly||!e.aiRelated).forEach(e=>on?bulkSel.add(e.id):bulkSel.delete(e.id));render()};
window.bkAi=(id,v)=>{bulkAi[id]=v;render()};
window.bkSetSel=v=>{if(!bulkSel.size)return setMsg('ยังไม่ได้เลือกรายการ');bulkSel.forEach(i=>bulkAi[i]=v);render()};
window.bkSaveAi=async()=>{const ids=Object.keys(bulkAi);if(!ids.length)return setMsg('ยังไม่มีค่าที่แก้ไข');
 if(!await askC('ยืนยันการบันทึกค่า "เนื้อหาเกี่ยวกับ AI"?',ids.length+' กิจกรรม','บันทึก',false))return;busy('กำลังบันทึก…');
 try{for(let i=0;i<ids.length;i+=15)await Promise.all(ids.slice(i,i+15).map(id=>{const e=events.find(x=>x.id===id);if(!e)return null;const o={...e,aiRelated:bulkAi[id]};delete o.id;return db.doc('events/'+id).set(o)}));bulkAi={};setMsg('บันทึกแล้ว')}
 catch(e){setMsg('บันทึกไม่สำเร็จ: '+(e.message||e.code))}finally{busy(false)}};
window.bkDel=async()=>{const ids=[...bulkSel].filter(id=>events.some(e=>e.id===id));if(!ids.length)return setMsg('ยังไม่ได้เลือกรายการที่จะลบ');
 if(!await askC('ยืนยันการลบ '+ids.length+' กิจกรรม?','กิจกรรมที่เลือกจะถูกลบถาวร (กู้คืนได้จากไฟล์สำรองเท่านั้น)'+(DRIVE_API?'\nโฟลเดอร์ไฟล์แนบใน Google Drive ของกิจกรรมเหล่านี้จะถูกย้ายไปถังขยะด้วย':'')))return;busy('กำลังลบ…');const evs=ids.map(id=>events.find(e=>e.id===id));
 try{for(let i=0;i<ids.length;i+=15)await Promise.all(ids.slice(i,i+15).map(id=>db.doc('events/'+id).delete()));ids.forEach(i=>{bulkSel.delete(i);delete bulkAi[i]});const r=await trashFolders(evs);setMsg('ลบแล้ว '+ids.length+' กิจกรรม'+delNote(r))}
 catch(e){setMsg('ลบไม่สำเร็จ: '+(e.message||e.code))}finally{busy(false)}};
window.bkJson=async()=>{const data={app:'RunSkill-KKUL',version:VER,exportedAt:new Date().toISOString(),events:events.map(e=>({...e})),formConfig:formCfg||null,clinic:clinic.map(r=>({...r})),clinicPII:{...clinicPII},clinicConfig:clCfgDoc||null,users:users.filter(u=>!u.builtin).map(u=>{const o={...u};delete o.pw;return o})};
 try{await dl.save({filename:'สำรองข้อมูล_'+TODAY()+'.json',data:new Blob([JSON.stringify(data,null,1)],{type:'application/json'})});toast('✅ ดาวน์โหลดไฟล์สำรองแล้ว ('+events.length+' กิจกรรม)',4000)}catch(e){toast('⚠️ '+(e.message||e),5000)}};
window.bkXlsx=async()=>{try{const rows=events.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>{const o={...e};delete o.id;return o});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'กิจกรรมทั้งหมด');
 await dl.save({filename:'กิจกรรมทั้งหมด_'+TODAY()+'.xlsx',data:new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})])});toast('✅ ดาวน์โหลดแล้ว',3000)}catch(e){toast('⚠️ '+(e.message||e),5000)}};
window.bkRestore=async inp=>{const f=inp.files[0];inp.value='';if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){return setMsg('ไฟล์สำรองไม่ถูกต้อง (อ่านไม่ได้)')}
 if(!d||!Array.isArray(d.events))return setMsg('ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ');
 if(!await askC('ยืนยันการกู้คืนข้อมูล?','กิจกรรม '+d.events.length+' รายการ จากไฟล์สำรองวันที่ '+String(d.exportedAt||'').slice(0,10)+'\nกิจกรรมที่รหัสตรงกันจะถูกเขียนทับ กิจกรรมอื่นที่มีอยู่แล้วจะไม่ถูกลบ','กู้คืน',false))return;
 busy('กำลังกู้คืนข้อมูล…');
 try{const list=d.events.filter(e=>e&&e.id);for(let i=0;i<list.length;i+=15)await Promise.all(list.slice(i,i+15).map(e=>{const o={...e},id=o.id;delete o.id;return db.doc('events/'+id).set(o)}));
  if(d.formConfig&&Array.isArray(d.formConfig.fields))await db.doc('settings/form').set(d.formConfig);
  if(Array.isArray(d.clinic))for(const r of d.clinic){if(!r||!r.id)continue;const o={...r},id=o.id;delete o.id;await db.doc('clinic/'+id).set(o);if(d.clinicPII&&d.clinicPII[id])await db.doc('clinicPII/'+id).set(d.clinicPII[id])}
  if(d.clinicConfig)await db.doc('settings/clinic').set(d.clinicConfig);setMsg('กู้คืนข้อมูลแล้ว '+list.length+' กิจกรรม')}
 catch(e){setMsg('กู้คืนไม่สำเร็จ: '+(e.message||e.code))}finally{busy(false)}};
window.autoU=()=>{$('#u4').value=$('#u3').value.split('@')[0].toLowerCase()};
window.eU=id=>{const a=users.find(x=>x.id===id);if(!a)return;$('#u1').value=a.firstName||'';$('#u2').value=a.lastName||'';$('#u3').value=a.email||'';$('#u3').readOnly=!!FB;$('#u4').value=a.username||'';$('#u5').value='';$('#u6').value=permOf(a);$('#u4').dataset.old=id;$('#uh').scrollIntoView()};
window.chPerm=async(id,sel)=>{const p=sel.value,pd=permToData(p),err=permCheck(id,pd);if(err){setMsg(err);return render()}
 const u=users.find(x=>x.id===id);if(!await askC('ยืนยันการเปลี่ยนสิทธิ์?',(u.firstName||'')+' '+(u.lastName||'')+' → '+PERM.find(x=>x[0]===p)[1],'เปลี่ยนสิทธิ์',false))return render();
 try{if(FB)await FS.doc('users/'+id).update(pd);else{const o={...u,...pd};delete o.id;await db.doc('users/'+id).set(o)}
  if(me&&me.id===id)me={...me,...pd};setMsg('เปลี่ยนสิทธิ์เป็น "'+PERM.find(x=>x[0]===p)[1]+'" แล้ว')}catch(e){setMsg('เปลี่ยนสิทธิ์ไม่สำเร็จ: '+(e.message||e.code));render()}};
window.dU=async id=>{const u=users.find(x=>x.id===id);if(!u)return;if(u.builtin)return setMsg('ไม่สามารถลบแอดมินหลักได้');
 if(me&&(id===me.id||u.username===me.username))return setMsg('ไม่สามารถลบบัญชีของตัวเองได้');
 if(isAdm(u)&&users.filter(isAdm).length<2)return setMsg('ต้องเหลือแอดมินอย่างน้อย 1 คน');
 if(!await askC('ยืนยันการลบผู้ใช้งาน?',(u.firstName||'')+' '+(u.lastName||'')+'\nบัญชีนี้จะเข้าสู่ระบบไม่ได้อีก (ข้อมูลกิจกรรมเดิมไม่ถูกลบ)'))return;
 try{if(FB){await FS.doc('users/'+id).delete();await FS.doc('usernames/'+u.username).delete()}else await db.doc('users/'+id).delete();setMsg('ลบผู้ใช้งานแล้ว')}catch(e){setMsg('ลบไม่สำเร็จ: '+(e.message||e.code))}};
window.saveUser=async()=>{const g=i=>$('#u'+i).value.trim(),perm=$('#u6').value,pd=permToData(perm),a={firstName:g(1),lastName:g(2),email:g(3),username:g(4).toLowerCase(),...pd},old=$('#u4').dataset.old;
 if(!a.firstName||!a.email||!a.username)return setMsg('กรุณากรอกข้อมูลให้ครบ');
 if(users.some(x=>x.username===a.username&&x.id!==old))return setMsg('Username นี้ถูกใช้แล้ว');
 if(old){const err=permCheck(old,pd);if(err)return setMsg(err)}
 if(!await askC(old?'ยืนยันการบันทึกการแก้ไข?':'ยืนยันการเพิ่มผู้ใช้งาน?',a.firstName+' '+a.lastName+' ('+a.username+') — '+PERM.find(x=>x[0]===perm)[1],'บันทึก',false))return;
 try{if(old){const prev=users.find(x=>x.id===old);
   if(FB){await FS.doc('users/'+old).update({firstName:a.firstName,lastName:a.lastName,username:a.username,role:a.role,isSpeaker:a.isSpeaker});
    if(prev.username!==a.username){await FS.doc('usernames/'+a.username).set({email:prev.email,uid:old});await FS.doc('usernames/'+prev.username).delete()}
    if(me&&me.id===old)me={...me,...a,email:prev.email};
    if(g(5))return setMsg('บันทึกแล้ว (รหัสผ่านไม่ถูกเปลี่ยน — ใช้ปุ่ม "✉ รีเซ็ตรหัส" เพื่อส่งลิงก์เปลี่ยนรหัสผ่านทางอีเมล)')}
   else{const o={...prev,...a};delete o.id;if(g(5))o.pw=await sha(g(5));await db.doc('users/'+a.username).set(o);if(old!==a.username)await db.doc('users/'+old).delete()}
   setMsg('บันทึกแล้ว')}
  else{const pw=g(5)||a.username+'1234';
   if(FB){if(pw.length<6)return setMsg('Password ต้องยาวอย่างน้อย 6 ตัวอักษร');
    const sec=firebase.apps.find(x=>x.name==='sec')||firebase.initializeApp(FB_CFG,'sec');await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
    const c=await sec.auth().createUserWithEmailAndPassword(a.email,pw),uid=c.user.uid;await sec.auth().signOut();
    await FS.doc('users/'+uid).set(a);await FS.doc('usernames/'+a.username).set({email:a.email,uid})}
   else await db.doc('users/'+a.username).set({...a,pw:await sha(pw)});
   setMsg('เพิ่มผู้ใช้งานแล้ว')}}
 catch(e){setMsg('ไม่สำเร็จ: '+(e.code==='auth/email-already-in-use'?'อีเมลนี้มีบัญชีอยู่แล้ว':(e.message||e.code)))}};
init();
</script></body></html>
