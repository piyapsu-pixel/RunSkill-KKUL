 try{const d=await FS.doc('usernames/'+u).get();const email=d.exists?d.data().email:(u==='piyapsu'?BOOT_EMAIL:null);if(!email)throw 0;await fAuth.signInWithEmailAndPassword(email,pw)}catch(e){setMsg('Username หรือ Password ไม่ถูกต้อง')}}
async function faUser(u){if(!u)return;
 try{const s=await FS.doc('users/'+u.uid).get();let p;
  if(!s.exists){if(u.email===BOOT_EMAIL){p={firstName:'Piyaphat',lastName:'Suwankasem',email:BOOT_EMAIL,username:'piyapsu',role:'admin'};await FS.doc('users/'+u.uid).set(p);await FS.doc('usernames/piyapsu').set({email:BOOT_EMAIL,uid:u.uid})}
   else{await fAuth.signOut();return setMsg('บัญชีนี้ยังไม่ได้รับสิทธิ์ในระบบ')}}else p=s.data();
  me={...p,id:u.uid,uid:u.uid};if(tab==='login')tab='form';msg='';
  if(faUnsub)faUnsub();faUnsub=FS.collection('users').onSnapshot(q=>{const l=q.docs.map(d=>({id:d.id,...d.data()}));admins=l.filter(x=>x.role==='admin');speakers=l.filter(x=>x.role==='speaker');render()},()=>{});
  render()}catch(e){try{await fAuth.signOut()}catch(x){}setMsg('เข้าสู่ระบบไม่สำเร็จ: '+(e.message||e.code))}}
async function faSaveUser(role,pre){const g=i=>$('#'+pre+i).value.trim(),a={firstName:g(1),lastName:g(2),email:g(3),username:g(4).toLowerCase(),role},old=$('#'+pre+'4').dataset.old;
 if(!a.firstName||!a.email||!a.username)return setMsg('กรุณากรอกข้อมูลให้ครบ');
 const lst=[...admins,...speakers];if(lst.some(x=>x.username===a.username&&x.id!==old))return setMsg('Username นี้ถูกใช้แล้ว');
 if(!await askC(old?'ยืนยันการบันทึกการแก้ไข?':'ยืนยันการเพิ่ม'+(role==='admin'?'แอดมิน':'วิทยากร')+'?',a.firstName+' '+a.lastName+' ('+a.username+')','บันทึก',false))return;
 try{if(old){const prev=lst.find(x=>x.id===old);await FS.doc('users/'+old).update({firstName:a.firstName,lastName:a.lastName,username:a.username});
   if(prev.username!==a.username){await FS.doc('usernames/'+a.username).set({email:prev.email,uid:old});await FS.doc('usernames/'+prev.username).delete()}
   if(g(5))return setMsg('บันทึกแล้ว (รหัสผ่านไม่ถูกเปลี่ยน — ใช้ปุ่ม "✉ รีเซ็ตรหัส" เพื่อส่งลิงก์เปลี่ยนรหัสผ่านทางอีเมล)');setMsg('บันทึกแล้ว')}
  else{const pw=g(5)||a.username+'1234';if(pw.length<6)return setMsg('Password ต้องยาวอย่างน้อย 6 ตัวอักษร');
   const sec=firebase.apps.find(x=>x.name==='sec')||firebase.initializeApp(FB_CFG,'sec');await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
   const c=await sec.auth().createUserWithEmailAndPassword(a.email,pw),uid=c.user.uid;await sec.auth().signOut();
   await FS.doc('users/'+uid).set(a);await FS.doc('usernames/'+a.username).set({email:a.email,uid});setMsg('เพิ่ม'+(role==='admin'?'แอดมิน':'วิทยากร')+'แล้ว')}}
 catch(e){setMsg('ไม่สำเร็จ: '+(e.code==='auth/email-already-in-use'?'อีเมลนี้มีบัญชีอยู่แล้ว':(e.message||e.code)))}}
async function faDel(id){const u=[...admins,...speakers].find(x=>x.id===id);if(!u)return;if(me&&id===me.uid)return setMsg('ไม่สามารถลบบัญชีของตัวเองได้');
 if(u.role==='admin'&&admins.length<2)return setMsg('ต้องเหลือแอดมินอย่างน้อย 1 คน');
 if(!await askC('ยืนยันการลบ'+(u.role==='admin'?'แอดมิน':'วิทยากร')+'?','บัญชีนี้จะเข้าสู่ระบบไม่ได้อีก'))return;
 try{await FS.doc('users/'+id).delete();await FS.doc('usernames/'+u.username).delete();setMsg('ลบแล้ว')}catch(e){setMsg('ลบไม่สำเร็จ: '+(e.message||e.code))}}

/* ---------- Calendar ---------- */
function vCal(){const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
 let c=TD.map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(first);
 for(let i=1;i<=n;i++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,ev=calEv().filter(e=>e.date<=k&&(e.endDate||e.date)>=k);
  c+=`<div class="d ${selDay===k?'sel':''} ${k===TODAY()?'today':''}" onclick="openDay('${k}')"><b>${i}</b>${ev.slice(0,2).map(e=>`<div class="t" onclick="event.stopPropagation();openEv(['${e.id}'])">${e.startTime?esc(e.startTime)+' ':''}${esc(e.topic)}</div>`).join('')}${ev.length>2?`<div class="mu">+${ev.length-2}</div>`:''}</div>`}
 const ev=selDay?calEv().filter(e=>e.date<=selDay&&(e.endDate||e.date)>=selDay):[];
 return `<div class="card"><div class="row" style="margin-bottom:12px"><span class="mu">🎤 วิทยากร</span><select id="cs" onchange="calSp=this.value;render()" style="flex:1;min-width:200px"><option value="">ทุกวิทยากร</option>${spNames().map(n=>`<option value="${esc(n)}" ${n===calSp?'selected':''}>${esc(n)}</option>`).join('')}</select></div>${calSp?`<div class="msg" style="margin:0 0 12px">แสดงเฉพาะกิจกรรมที่ "${esc(calSp)}" เป็นวิทยากร — ${calEv().length} กิจกรรม</div>`:''}<div class="row"><button onclick="cur=new Date(${y},${m-1},1);render()">◀</button><span style="flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><select id="cm" onchange="calGo()">${MF.map((t,i)=>`<option value="${i}" ${i===m?'selected':''}>${t}</option>`).join('')}</select><select id="cy" onchange="calGo()">${[...Array(21)].map((_,i)=>y-10+i).map(v=>`<option value="${v}" ${v===y?'selected':''}>${v+543}</option>`).join('')}</select><button onclick="cur=new Date();render()">วันนี้</button></span><button onclick="cur=new Date(${y},${m+1},1);render()">▶</button></div><br><div class="cal">${c}</div></div>`+popHtml()}
function detail(e){return `<p><b>${esc(e.topic)}</b></p><p>📆 ${fd(e.date)}${e.endDate&&e.endDate!==e.date?' – '+fd(e.endDate):''}${e.startTime?`<br>⏰ ${esc(e.startTime)}${e.endTime?' – '+esc(e.endTime):''} น.`:''}<br>🎤 วิทยากร: ${esc(e.speaker)}<br>📍 ${esc(e.location)}<br>🏛 จัดโดย: ${esc(e.faculty)}<br>${e.trainType||e.courseType?`🏷 ${esc(e.trainType||'-')} · ${esc(e.courseType||'-')}<br>`:''}${e.orgType||e.attType?`🏢 ส่วนงาน: ${esc(e.orgType||'-')} · ผู้เข้าร่วม: ${esc(e.attType||'-')}<br>`:''}👥 ผู้เข้าร่วม: ${esc(e.attendees||'-')} คน${customLines(e)}${e.notes?`<br>📝 ${esc(e.notes)}`:''}</p>
 ${e.driveFolder&&me?`<a href="${esc(e.driveFolder)}" target="_blank" rel="noopener"><button>📁 เปิดโฟลเดอร์ใน Drive</button></a> `:''}${e.letterId?`<button onclick="dlFile('${e.id}','letter')">⬇ หนังสือเชิญวิทยากร</button> `:''}${e.rosterId?`<button onclick="dlFile('${e.id}','roster')">⬇ รายชื่อผู้เข้าอบรม</button> `:''}<button onclick="editEv('${e.id}')">✏️ แก้ไขการอบรม</button> ${me?`<button onclick="delEv('${e.id}')">ลบ</button>`:''}`}
const gasLink=e=>gas.url+'?'+new URLSearchParams({token:gas.token||'',id:e.id,date:e.date||'',endDate:e.endDate||'',speaker:e.speaker||'',topic:e.topic||'',location:e.location||'',attendees:e.attendees||'',faculty:e.faculty||'',trainType:e.trainType||'',courseType:e.courseType||'',notes:e.notes||''}).toString();
const spRow=n=>`<div class="row" style="flex-wrap:nowrap;margin-bottom:6px"><div class="cbx" style="flex:1;min-width:0"><input class="spk" autocomplete="off" placeholder="🔍 ค้นหา / เลือกชื่อวิทยากร" value="${esc(n)}" onfocus="cbOpen(this)" oninput="cbOpen(this)" onblur="cbClose(this)" style="width:100%;padding-right:30px"><span class="cba">▾</span><div class="cbl hide"></div></div><button type="button" title="ลบช่องนี้" onclick="rmSp(this)">✕</button></div>`;
const spInputs=s=>{const a=spl(s);return (a.length?a:['']).map(spRow).join('')};
window.cbOpen=i=>{const L=i.parentNode.querySelector('.cbl'),q=normN(i.value),used=[...document.querySelectorAll('.spk')].filter(x=>x!==i).map(x=>normN(x.value));
 const ns=spNames().filter(n=>!q||normN(n).includes(q));
 L.innerHTML=ns.length?ns.map(n=>`<div onmousedown="cbPick(this,event)" data-v="${esc(n)}">${esc(n)}${used.includes(normN(n))?' <small class="mu">(เลือกแล้ว)</small>':''}</div>`).join(''):'<div class="mu" style="cursor:default">ไม่พบชื่อในรายชื่อ — พิมพ์ชื่อเพื่อเพิ่มวิทยากรใหม่ได้</div>';L.classList.remove('hide')};
window.cbPick=(el,ev)=>{ev.preventDefault();const w=el.closest('.cbx');w.querySelector('input').value=el.dataset.v;w.querySelector('.cbl').classList.add('hide')};
window.cbClose=i=>setTimeout(()=>{const L=i.parentNode.querySelector('.cbl');if(L)L.classList.add('hide')},150);
window.addSp=()=>{$('#spk').insertAdjacentHTML('beforeend',spRow(''));[...document.querySelectorAll('.spk')].pop().focus()};
window.rmSp=b=>{const r=b.closest('.row');if(document.querySelectorAll('.spk').length>1)r.remove();else r.querySelector('input').value=''};
function askC(t,s,ok,dg){return new Promise(res=>{const o=document.createElement('div');o.className='mdl';o.innerHTML=`<div class="mb"><h3>${esc(t)}</h3><p class="mu" style="white-space:pre-line">${esc(s||'')}</p><div class="row" style="justify-content:flex-end"><button id="cn">ยกเลิก</button><button id="cy2" class="p" ${dg===false?'':'style="background:#e5484d;box-shadow:none"'}>${esc(ok||'ลบ')}</button></div></div>`;document.body.appendChild(o);const f=v=>{o.remove();res(v)};o.querySelector('#cn').onclick=()=>f(false);o.querySelector('#cy2').onclick=()=>f(true);o.onclick=ev=>{if(ev.target===o)f(false)}})}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('อ่านไฟล์ไม่สำเร็จ'));r.readAsDataURL(f)});
async function drivePost(o){const r=await fetch(DRIVE_API,{method:'POST',body:JSON.stringify({...o,token:DRIVE_TOKEN})});if(!r.ok)throw new Error('เชื่อมต่อ Google Drive ไม่ได้ ('+r.status+')');return r.json()}
async function upFile(file,kind,folder,oldId){if(!DRIVE_API)return{id:(await assets.upload(file)).id};
 const d=await drivePost({action:'upload',folder,kind,fileName:file.name,mime:file.type||'application/octet-stream',data:await b64(file),replaceId:String(oldId||'').startsWith('drive:')?oldId.slice(6):''});
 if(!d.ok)throw new Error(d.error||'อัปโหลดไม่สำเร็จ');return{id:'drive:'+d.fileId,folder:d.folderUrl}}
window.dlFile=async(id,w)=>{const e=events.find(x=>x.id===id),bid=e&&e[w+'Id'];if(!bid)return;
 if(String(bid).startsWith('drive:')){try{setMsg('กำลังดาวน์โหลดจาก Google Drive…');const d=await drivePost({action:'download',id:bid.slice(6)});if(!d.ok)throw new Error(d.error||'ไม่พบไฟล์');const bin=atob(d.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await dl.save({filename:e[w+'Name']||d.name,data:new Blob([u],{type:d.mime})});setMsg('ดาวน์โหลดแล้ว')}catch(x){setMsg('ดาวน์โหลดไม่สำเร็จ: '+(x.message||x))}return}
let name=e[w+'Name']||(w==='letter'?'หนังสือเชิญวิทยากร':'รายชื่อผู้เข้าอบรม');
 try{const r=await fetch('/_blob/'+bid);if(!r.ok)throw 0;const b=await r.blob();if(!/\.\w{2,5}$/.test(name))name+=({'application/pdf':'.pdf','image/png':'.png','image/jpeg':'.jpg','text/csv':'.csv','text/plain':'.txt'}[b.type]||'');await dl.save({filename:name,data:b})}catch(x){window.open('/_blob/'+bid,'_blank')}};

/* ---------- Form + AI ---------- */
const DEF=[{k:'date',l:'วันที่จัดอบรม (เริ่ม)',t:'date',r:1,b:1},{k:'endDate',l:'วันที่สิ้นสุด',t:'date',b:1},{k:'startTime',l:'เวลาเริ่ม',t:'time',b:1},{k:'endTime',l:'เวลาสิ้นสุด',t:'time',b:1},{k:'speaker',l:'ชื่อวิทยากร',t:'text',b:1},{k:'topic',l:'หัวข้อการอบรม',t:'text',r:1,b:1},{k:'location',l:'สถานที่',t:'text',b:1},{k:'attendees',l:'จำนวนผู้เข้าร่วม (คน)',t:'number',b:1},{k:'faculty',l:'คณะ/หน่วยงานที่จัดกิจกรรม',t:'text',b:1},{k:'trainType',l:'ประเภทการอบรม',t:'select',o:['ในตาราง','นอกตาราง'],b:1},{k:'courseType',l:'ประเภทหลักสูตร',t:'select',o:['Academic Skills','Occupation Skills'],b:1},{k:'orgType',l:'ส่วนงาน',t:'select',o:['ภายใน มข.','ภายนอก มข.'],b:1},{k:'attType',l:'ประเภทผู้เข้าร่วมอบรม',t:'select',o:['นักเรียน','นักศึกษา มข.','บุคลากร มข.','บุคคลภายนอก มข.'],b:1}];
const LOCK=['date','endDate','speaker','attendees'];
const cfg=()=>{const st=formCfg&&Array.isArray(formCfg.fields)&&formCfg.fields.length?formCfg.fields:null;if(!st)return DEF.map(x=>({...x}));
 const out=st.map(f=>{const d=DEF.find(x=>x.k===f.k);return d?{...d,...f,t:LOCK.includes(d.k)?d.t:(f.t||d.t),b:1}:f});DEF.forEach(d=>{if(!out.some(f=>f.k===d.k))out.push({...d})});return out};

  onclone:(d,n)=>{n=n||d.querySelector('#rep');d.querySelectorAll('*').forEach(x=>{x.style.animation='none';x.style.transition='none'});

   n.querySelectorAll('table tr').forEach((tr,i)=>{const q=tr.getBoundingClientRect();if(i===0)hd=[q.top-t0,q.bottom-t0];else{br.push(q.top-t0);trs.add(Math.round(q.top-t0))}})}});

 const pages=[];let y=0;
 while(y<H-1){const isRow=!!hd&&trs.has(Math.round(y)),cap=capCss-(isRow?hh:0);let end=Math.min(H,y+cap);

window.auto=()=>{$('#a4').value=$('#a3').value.split('@')[0].toLowerCase()};
window.eA=id=>{const a=admins.find(x=>x.id===id);$('#a1').value=a.firstName;$('#a2').value=a.lastName;$('#a3').value=a.email;$('#a3').readOnly=!!FB;$('#a4').value=a.username;$('#a5').value='';$('#a4').dataset.old=id;scrollTo(0,document.body.scrollHeight)};
window.dA=async id=>{if(FB)return faDel(id);if(id==='piyapsu')return setMsg('ไม่สามารถลบแอดมินหลัก (piyapsu) ได้');if(admins.length<2)return setMsg('ต้องเหลือแอดมินอย่างน้อย 1 คน');if(await askC('ยืนยันการลบแอดมิน?','ผู้ใช้นี้จะเข้าสู่ระบบไม่ได้อีก'))try{await db.doc('admins/'+id).delete()}catch(e){setMsg('ลบไม่สำเร็จ')}};
window.sA=async()=>{if(FB)return faSaveUser('admin','a');const a={firstName:$('#a1').value.trim(),lastName:$('#a2').value.trim(),email:$('#a3').value.trim(),username:$('#a4').value.trim().toLowerCase()},old=$('#a4').dataset.old;
 if(!a.firstName||!a.email||!a.username)return setMsg('กรุณากรอกข้อมูลให้ครบ');if(speakers.some(x=>x.username===a.username))return setMsg('Username นี้ถูกใช้แล้ว (มีในรายชื่อวิทยากร)');if(!await askC(old?'ยืนยันการบันทึกการแก้ไขแอดมิน?':'ยืนยันการเพิ่มแอดมิน?',a.firstName+' '+a.lastName+' ('+a.username+')','บันทึก',false))return;const pw=$('#a5').value||(old?null:a.username+'1234');
 if(pw)a.pw=await sha(pw);else a.pw=admins.find(x=>x.id===old).pw;
 try{await db.doc('admins/'+a.username).set(a);if(old&&old!==a.username)await db.doc('admins/'+old).delete();setMsg('บันทึกแอดมินแล้ว')}catch(e){setMsg('บันทึกไม่สำเร็จ: '+(e.message||e.code))}};
init();
</script></body></html>
